name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'tests/**.py'
      - 'params.yaml'
      - 'requirements*.txt'
      - '.dvc/config'
      - '.github/workflows/cicd.yml'
  workflow_dispatch:

permissions:
  contents: read

# Prevent overlapping runs from publishing different models to the same VM.
concurrency:
  group: income-model-release
  cancel-in-progress: false

env:
  MLFLOW_TRACKING_URI: sqlite:///mlflow.db
  MLFLOW_ARTIFACT_ROOT: ./mlartifacts

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Read AWS role and region
        id: aws_settings
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python - <<'PYEOF'
          import json, os
          settings = json.loads(os.environ['STORAGE_CREDENTIALS'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              for key in ['role_arn', 'region']:
                  value = settings[key]
                  if not isinstance(value, str) or not value or any(c in value for c in '\r\n'):
                      raise ValueError(f'Invalid AWS {key}')
                  f.write(f'{key}={value}\n')
          PYEOF
      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ steps.aws_settings.outputs.role_arn }}
          aws-region: ${{ steps.aws_settings.outputs.region }}
          role-session-name: income-train-${{ github.run_id }}
      - name: Pull data with DVC
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          dvc remote add --local --force -d labstore "s3://$ARTIFACT_BUCKET/dvc"
          dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc
      - name: Train and generate precision recall report
        run: python src/train.py
      - name: Read report
        id: read_report
        run: |
          python - <<'PYEOF'
          import json, os
          with open('outputs/report.json') as f:
              report = json.load(f)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"f1={report['f1_score']}\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f"Training rows: {report['n_train']}\n\nF1: {report['f1_score']:.6f}\n\nAccuracy: {report['accuracy']:.6f}\n")
          PYEOF
      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            outputs/report.json
            outputs/detail.txt
          if-no-files-found: error
      - name: Upload candidate to S3
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python -m src.artifacts upload --bucket "$ARTIFACT_BUCKET" --prefix "artifacts/runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v4
        with:
          name: report
          path: outputs
      - name: Check positive-class F1 >= 0.65
        run: python src/quality_gate.py outputs/report.json

  release:
    name: Release
    needs: [train, quality-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install storage SDK
        run: python -m pip install -r requirements-serving.txt
      - name: Read AWS role and region
        id: aws_settings
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python - <<'PYEOF'
          import json, os
          settings = json.loads(os.environ['STORAGE_CREDENTIALS'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              for key in ['role_arn', 'region']:
                  value = settings[key]
                  if not isinstance(value, str) or not value or any(c in value for c in '\r\n'):
                      raise ValueError(f'Invalid AWS {key}')
                  f.write(f'{key}={value}\n')
          PYEOF
      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ steps.aws_settings.outputs.role_arn }}
          aws-region: ${{ steps.aws_settings.outputs.region }}
          role-session-name: income-release-${{ github.run_id }}
      - name: Publish approved candidate
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python -m src.artifacts publish --bucket "$ARTIFACT_BUCKET" --prefix "artifacts/runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Copy serving code to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: 'src/serve.py,requirements-serving.txt'
          target: '/home/${{ secrets.SERVER_USER }}/'
      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu
            cd "$HOME"
            .venv/bin/python -m pip install -r requirements-serving.txt
            sudo systemctl restart income-api
            for attempt in $(seq 1 15); do
              if curl --fail --silent --show-error --max-time 5 http://localhost:8080/healthz; then
                curl --fail --silent --show-error --max-time 5 -X POST http://localhost:8080/score -H 'Content-Type: application/json' -d '{"features":[28,2,14,2,11,0,1,0,0,45]}'
                echo 'Health and inference checks passed.'
                exit 0
              fi
              sleep 2
            done
            sudo journalctl -u income-api -n 30 --no-pager
            exit 1
